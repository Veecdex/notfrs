<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Reset password - Paperz</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
<script>
  (function () {
    const saved = localStorage.getItem("notes_theme");
    const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.setAttribute("data-theme", saved || (prefersDark ? "dark" : "light"));
  })();
</script>
</head>
<body>
  <div class="device-shell">
    <div class="device">

      <div class="app-topbar" style="justify-content:flex-end;">
        <button id="theme-toggle" class="theme-toggle" title="Toggle dark mode">
          <span class="icon-row"></span>
          <span class="knob" id="theme-knob"></span>
        </button>
      </div>

      <div class="auth-scroll">
        <div class="auth-icon" id="auth-icon"></div>

        <!-- Step 1: enter email -->
        <div id="step-email">
          <h1>Reset your password</h1>
          <p class="sub">Enter the email on your account and we'll get you back in.</p>

          <form id="email-form">
            <div class="field-group">
              <label class="field-label" for="email">Email</label>
              <input type="email" id="email" class="field-input" required autocomplete="email" />
            </div>
            <button type="submit" id="check-btn" class="btn-primary">Continue</button>
          </form>
        </div>

        <!-- Step 2: set new password (shown once the email is confirmed) -->
        <div id="step-reset" style="display:none;">
          <h1>Choose a new password</h1>
          <p class="sub">Resetting the password for <strong id="found-email-label"></strong></p>

          <form id="reset-form">
            <div class="field-group">
              <label class="field-label" for="new-password">New password</label>
              <div class="field-input-wrap">
                <input type="password" id="new-password" class="field-input" required minlength="8" autocomplete="new-password" />
                <button type="button" id="toggle-new-password" class="password-toggle-btn"></button>
              </div>
            </div>
            <div class="field-group">
              <label class="field-label" for="confirm-new-password">Confirm new password</label>
              <div class="field-input-wrap">
                <input type="password" id="confirm-new-password" class="field-input" required minlength="8" autocomplete="new-password" />
                <button type="button" id="toggle-confirm-new-password" class="password-toggle-btn"></button>
              </div>
            </div>
            <button type="submit" id="reset-btn" class="btn-primary">Update password</button>
          </form>
        </div>

        <div id="error-box" class="inline-error"></div>

        <p class="auth-footer">Remembered it after all? <a href="login.html">Back to login</a></p>
      </div>

      <div id="toast-stack" class="toast-stack"></div>
    </div>
  </div>

  <script src="js/icons.js"></script>
  <script src="js/ui-helpers.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.getElementById("auth-icon").innerHTML = Icons.mailQuestion;
    document.querySelector("#theme-toggle .icon-row").innerHTML = `<span>${Icons.sun}</span><span>${Icons.moon}</span>`;
    function syncKnobIcon() {
      const isDark = document.documentElement.getAttribute("data-theme") === "dark";
      document.getElementById("theme-knob").innerHTML = isDark ? Icons.moon : Icons.sun;
    }
    syncKnobIcon();
    document.getElementById("theme-toggle").addEventListener("click", () => setTimeout(syncKnobIcon, 0));
    initThemeToggle();
    initPasswordToggle("new-password", "toggle-new-password");
    initPasswordToggle("confirm-new-password", "toggle-confirm-new-password");
    initForgotPasswordForm();
  </script>
</body>
</html>
